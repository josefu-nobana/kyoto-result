<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VALORANT Match Result Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Arial', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    #toggle-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: #ff4655;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #admin-panel {
      position: fixed;
      top: 45px;
      left: 10px;
      z-index: 9999;
      background: rgba(15, 25, 35, 0.96);
      border: 2px solid #ff4655;
      padding: 15px;
      border-radius: 8px;
      color: white;
      max-height: 88vh;
      overflow-y: auto;
      width: 440px;
      font-family: sans-serif;
    }

    .panel-hidden { display: none !important; }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      padding: 6px 8px;
      margin: 10px 0 6px 0;
      border-radius: 4px;
    }
    .blue-title { background: #00b4d8; color: white; }
    .red-title { background: #ff4655; color: white; }
    .sheet-title { background: #2ecc71; color: #111; }

    .info-box {
      background: rgba(255,255,255,0.08);
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctrl-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 4px;
    }
    .ctrl-inputs { display: flex; gap: 4px; }
    .ctrl-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .ctrl-label { font-size: 11px; font-weight: bold; }

    input[type="text"], input[type="number"], select {
      padding: 5px 6px;
      border-radius: 4px;
      border: 1px solid #364966;
      background: #111c24;
      color: white;
      font-size: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    .lbl-sm { font-size: 10px; color: #aaa; margin-bottom: 2px; }

    .btn-action { background: #2ecc71; color: #111; font-weight: bold; border: none; padding: 6px; border-radius: 4px; cursor: pointer; }
    .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-control { flex: 1; padding: 8px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-reset { background: #e74c3c; color: white; }

    /* =========================================
       OVERLAY SCREEN (1920x1080) - 写真完全一致レイアウト
       ========================================= */
    #overlay-container {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen-wrapper {
      width: 1680px;
      height: 940px;
      background: #0f131a;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 背景のマップ透過画像 */
    .bg-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.22;
      z-index: 0;
    }

    /* 1. 最上部チーム名ヘッダー */
    .team-headers {
      position: relative;
      z-index: 2;
      height: 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(15, 20, 28, 0.75);
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }

    .team-title-box {
      display: flex;
      align-items: center;
      padding: 0 50px;
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
    }
    .team-title-box.blue { justify-content: flex-start; border-left: 8px solid #00b4d8; }
    .team-title-box.red { justify-content: flex-end; border-right: 8px solid #ff4655; }

    /* 2. 中央指標ラベル（KD, ACS, FIRST KILLS） */
    .center-metrics {
      position: absolute;
      left: 50%;
      top: 140px;
      transform: translateX(-50%);
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 5;
    }
    .metric-item {
      font-size: 13px;
      font-weight: 900;
      color: #9ea7b3;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(15, 22, 30, 0.85);
      padding: 2px 14px;
      border-radius: 3px;
    }

    /* 3. MVPセクション（上段：トッププレイヤー1人ずつ） */
    .mvp-section {
      position: relative;
      z-index: 2;
      height: 220px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid rgba(255,255,255,0.12);
      background: rgba(10, 15, 22, 0.45);
    }

    .mvp-card {
      display: flex;
      align-items: center;
      padding: 0 40px;
      position: relative;
    }
    .mvp-card.blue { justify-content: flex-start; }
    .mvp-card.red { justify-content: flex-end; flex-direction: row-reverse; }

    .mvp-avatar-box {
      width: 150px;
      height: 190px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      background: #16222c;
    }
    .mvp-card.blue .mvp-avatar-box { border-left: 5px solid #00b4d8; }
    .mvp-card.red .mvp-avatar-box { border-right: 5px solid #ff4655; }
    .mvp-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

    .mvp-tag {
      position: absolute;
      top: 8px;
      background: #7b2cbf;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 10px;
      letter-spacing: 1px;
      border-radius: 2px;
    }
    .mvp-card.blue .mvp-tag { left: 10px; }
    .mvp-card.red .mvp-tag { right: 10px; }

    .mvp-stats-block {
      display: flex;
      gap: 30px;
      margin: 0 30px;
      align-items: baseline;
    }
    .mvp-card.blue .mvp-stats-block { flex-direction: row; }
    .mvp-card.red .mvp-stats-block { flex-direction: row-reverse; }

    .mvp-val {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      text-align: center;
    }

    /* 4. 通常メンバーセクション（下段：2〜5人目） */
    .members-section {
      position: relative;
      z-index: 2;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(10, 15, 22, 0.3);
    }

    .members-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 12px 40px;
      position: relative;
    }
    .members-col.blue { border-right: 1px solid rgba(255,255,255,0.08); }

    .member-row {
      display: grid;
      grid-template-columns: 65px 120px 100px;
      align-items: center;
      height: 64px;
      background: rgba(255,255,255,0.03);
      padding: 0 10px;
      border-radius: 4px;
    }
    .members-col.blue .member-row { grid-template-columns: 65px 120px 100px; justify-content: start; gap: 40px; }
    .members-col.red .member-row { grid-template-columns: 100px 120px 65px; justify-content: end; gap: 40px; direction: rtl; }

    .member-avatar {
      width: 52px;
      height: 52px;
      object-fit: cover;
      object-position: top center;
      border-radius: 4px;
      background: #16222c;
    }
    .members-col.blue .member-avatar { border-left: 3px solid #00b4d8; }
    .members-col.red .member-avatar { border-right: 3px solid #ff4655; direction: ltr; }

    .member-stat {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-align: center;
    }
    .members-col.red .member-stat { direction: ltr; }

    /* 右下のチームロゴ配置エリア（写真のKYOTOロゴの位置） */
    .team-logo-box {
      position: absolute;
      right: 40px;
      bottom: 20px;
      width: 150px;
      height: 150px;
      background: #0d233a;
      border: 2px solid #00b4d8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .team-logo-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <button id="toggle-btn" onclick="togglePanel()">⚙️ 管理パネル 開閉</button>

  <div id="admin-panel">
    <h3 style="margin: 0 0 8px 0; color: #ff4655; font-size: 14px;">VALORANT リザルト設定（写真一致版）</h3>

    <div class="btn-group">
      <button class="btn-control btn-reset" onclick="resetAllState()">全リセット</button>
    </div>

    <div class="section-title sheet-title">📊 スプレッドシート連携</div>
    <div class="info-box">
      <input type="text" id="sheet-id-input" placeholder="スプレッドシートID" oninput="sendState()">
      <button class="btn-action" onclick="fetchSheetData()">データ読み込み</button>
    </div>

    <div class="section-title blue-title">BLUE TEAM (左側)</div>
    <div class="info-box">
      <select id="select-team-blue-preset" onchange="applyTeamPreset('blue')">
        <option value="">-- シートからチーム選択 --</option>
      </select>
      <input type="text" id="team-blue-name" value="東京TECH B" oninput="sendState()" placeholder="チーム名">
      <input type="text" id="team-blue-logo" value="" oninput="sendState()" placeholder="右下チームロゴURL">
    </div>
    <div id="blue-controls"></div>

    <div class="section-title red-title">RED TEAM (右側)</div>
    <div class="info-box">
      <select id="select-team-red-preset" onchange="applyTeamPreset('red')">
        <option value="">-- シートからチーム選択 --</option>
      </select>
      <input type="text" id="team-red-name" value="名古屋TECH B" oninput="sendState()" placeholder="チーム名">
    </div>
    <div id="red-controls"></div>
  </div>

  <!-- オーバーレイ画面 (1920x1080) -->
  <div id="overlay-container">
    <div class="screen-wrapper">
      <img id="bg-map-img" class="bg-map" src="images/sunset.png" alt="map">

      <!-- 1. 最上部チーム名 -->
      <div class="team-headers">
        <div id="name-blue-display" class="team-title-box blue">東京TECH B</div>
        <div id="name-red-display" class="team-title-box red">名古屋TECH B</div>
      </div>

      <!-- 2. 中央指標ラベル -->
      <div class="center-metrics">
        <div class="metric-item">KD</div>
        <div class="metric-item">ACS</div>
        <div class="metric-item">FIRST KILLS</div>
      </div>

      <!-- 3. MVPセクション (プレイヤー1) -->
      <div class="mvp-section">
        <!-- BLUE MVP -->
        <div class="mvp-card blue">
          <div class="mvp-avatar-box">
            <div class="mvp-tag">MVP</div>
            <img id="img-blue-1" class="mvp-img" src="images/jett.png" alt="agent">
          </div>
          <div class="mvp-stats-block">
            <div id="kda-blue-1" class="mvp-val">23 / 13</div>
            <div id="acs-blue-1" class="mvp-val">340</div>
            <div id="fk-blue-1" class="mvp-val">5</div>
          </div>
        </div>

        <!-- RED MVP -->
        <div class="mvp-card red">
          <div class="mvp-avatar-box">
            <div class="mvp-tag">MVP</div>
            <img id="img-red-1" class="mvp-img" src="images/omen.png" alt="agent">
          </div>
          <div class="mvp-stats-block">
            <div id="fk-red-1" class="mvp-val">1</div>
            <div id="acs-red-1" class="mvp-val">261</div>
            <div id="kda-red-1" class="mvp-val">20 / 9</div>
          </div>
        </div>
      </div>

      <!-- 4. 通常メンバーセクション (プレイヤー2〜5) -->
      <div class="members-section">
        <div id="blue-members-col" class="members-col blue"></div>
        <div id="red-members-col" class="members-col red"></div>
      </div>

      <!-- 右下のチームロゴ枠 -->
      <div id="team-logo-container" class="team-logo-box" style="display:none;">
        <img id="team-logo-display" class="team-logo-img" src="" alt="logo" onerror="this.parentElement.style.display='none';">
      </div>
    </div>
  </div>

  <script>
    const agents = [
      { category: "デュエリスト", list: [
        { id: "jett", name: "ジェット" }, { id: "phoenix", name: "フェニックス" },
        { id: "reyna", name: "レイナ" }, { id: "raze", name: "レイズ" },
        { id: "yoru", name: "ヨル" }, { id: "neon", name: "ネオン" },
        { id: "iso", name: "アイソ" }, { id: "waylay", name: "ウェイレイ" },
        { id: "hash", name: "ハッシュ" }
      ]},
      { category: "イニシエーター", list: [
        { id: "sova", name: "ソーヴァ" }, { id: "breach", name: "ブリーチ" },
        { id: "skye", name: "スカイ" }, { id: "kayo", name: "KAY/O" },
        { id: "fade", name: "フェイド" }, { id: "gekko", name: "ゲッコー" },
        { id: "tejo", name: "テホ" }
      ]},
      { category: "コントローラー", list: [
        { id: "brimstone", name: "ブリムストーン" }, { id: "omen", name: "オーメン" },
        { id: "viper", name: "ヴァイパー" }, { id: "astra", name: "アストラ" },
        { id: "harbor", name: "ハーバー" }, { id: "clove", name: "クローヴ" },
        { id: "miks", name: "ミクス" }
      ]},
      { category: "センチネル", list: [
        { id: "sage", name: "セージ" }, { id: "cypher", name: "サイファー" },
        { id: "killjoy", name: "キルジョイ" }, { id: "chamber", name: "チェンバー" },
        { id: "deadlock", name: "デッドロック" }, { id: "vyse", name: "ヴァイス" },
        { id: "veto", name: "ヴィトー" }
      ]}
    ];

    const TOPIC_URL = "https://ntfy.sh/josefu_val_result_exact_2026";
    let loadedTeamsData = [];
    let isRemoteUpdating = false;

    function setSafeImage(url, imgElement) {
      if (!url) { imgElement.style.display = 'none'; return; }
      let val = String(url).trim();
      const matchImageFunc = val.match(/=IMAGE\s*\(\s*["']([^"']+)["']\s*\)/i);
      if (matchImageFunc && matchImageFunc[1]) val = matchImageFunc[1];
      if (val.includes("drive.google.com") || val.includes("googleusercontent.com")) {
        let fileId = "";
        const matchId = val.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (matchId && matchId[1]) fileId = matchId[1];
        else {
          const matchParam = val.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          if (matchParam && matchParam[1]) fileId = matchParam[1];
        }
        if (fileId) val = `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        const cleaned = val.toLowerCase().replace(/\s+/g, '');
        imgElement.src = cleaned.endsWith('.png') ? `images/${cleaned}` : `images/${cleaned}.png`;
        imgElement.style.display = 'block';
        return;
      }
      imgElement.src = val;
      imgElement.style.display = 'block';
    }

    function createAgentSelectHTML(id, defaultAgent) {
      let html = `<select id="agent-${id}" onchange="sendState()">`;
      agents.forEach(group => {
        html += `<optgroup label="${group.category}">`;
        group.list.forEach(a => {
          const sel = (a.id === defaultAgent) ? 'selected' : '';
          html += `<option value="${a.id}" ${sel}>${a.name}</option>`;
        });
        html += `</optgroup>`;
      });
      html += `</select>`;
      return html;
    }

    function init() {
      ['blue', 'red'].forEach(side => {
        const ctrl = document.getElementById(`${side}-controls`);
        const membersCol = document.getElementById(`${side}-members-col`);
        const titleColor = side === 'blue' ? '#00b4d8' : '#ff4655';

        for (let i = 1; i <= 5; i++) {
          const id = `${side}-${i}`;
          const defAgent = i === 1 ? (side === 'blue' ? 'jett' : 'omen') : (side === 'blue' ? 'sova' : 'neon');
          const badgeText = i === 1 ? ' [👑 MVP 上段]' : ` [メンバー ${i}]`;

          ctrl.innerHTML += `
            <div class="ctrl-row">
              <span class="ctrl-label" style="color:${titleColor};">${side.toUpperCase()}${badgeText}</span>
              <div class="ctrl-inputs">
                ${createAgentSelectHTML(id, defAgent)}
              </div>
              <div class="ctrl-stats">
                <div><div class="lbl-sm">KD</div><input type="text" id="kda-input-${id}" value="${i===1?'23 / 13':'5 / 16'}" oninput="sendState()"></div>
                <div><div class="lbl-sm">ACS</div><input type="number" id="acs-input-${id}" value="${i===1?'340':'104'}" oninput="sendState()"></div>
                <div><div class="lbl-sm">FK (1位のみ)</div><input type="number" id="fk-input-${id}" value="${i===1?'5':'0'}" oninput="sendState()"></div>
              </div>
            </div>`;

          if (i > 1) {
            membersCol.innerHTML += `
              <div class="member-row">
                <img id="img-${id}" class="member-avatar" src="images/${defAgent}.png" alt="agent">
                <div id="kda-${id}" class="member-stat">5 / 16</div>
                <div id="acs-${id}" class="member-stat">104</div>
              </div>`;
          }
        }
      });

      if (window.location.search.includes('obs')) {
        const style = document.createElement('style');
        style.innerHTML = '#admin-panel, #toggle-btn { display: none !important; }';
        document.head.appendChild(style);
      }

      listenForUpdates();
    }

    function renderUI(data) {
      if (!data) return;
      isRemoteUpdating = true;

      if (data.teams) {
        if (data.teams.blue) {
          document.getElementById('team-blue-name').value = data.teams.blue.name;
          document.getElementById('name-blue-display').innerText = data.teams.blue.name;
          document.getElementById('team-blue-logo').value = data.teams.blue.logo || '';
          const logoContainer = document.getElementById('team-logo-container');
          if (data.teams.blue.logo) {
            logoContainer.style.display = 'flex';
            setSafeImage(data.teams.blue.logo, document.getElementById('team-logo-display'));
          } else {
            logoContainer.style.display = 'none';
          }
        }
        if (data.teams.red) {
          document.getElementById('team-red-name').value = data.teams.red.name;
          document.getElementById('name-red-display').innerText = data.teams.red.name;
        }
      }

      if (data.players) {
        Object.keys(data.players).forEach(id => {
          const p = data.players[id];
          document.getElementById(`agent-${id}`).value = p.agent;
          document.getElementById(`kda-input-${id}`).value = p.kda;
          document.getElementById(`acs-input-${id}`).value = p.acs;
          document.getElementById(`fk-input-${id}`).value = p.fk;

          document.getElementById(`img-${id}`).src = `images/${p.agent}.png`;
          if (id.endsWith('-1')) {
            document.getElementById(`kda-${id}`).innerText = p.kda;
            document.getElementById(`acs-${id}`).innerText = p.acs;
            document.getElementById(`fk-${id}`).innerText = p.fk;
          } else {
            document.getElementById(`kda-${id}`).innerText = p.kda;
            document.getElementById(`acs-${id}`).innerText = p.acs;
          }
        });
      }

      setTimeout(() => { isRemoteUpdating = false; }, 200);
    }

    let sendTimer = null;
    function sendState() {
      if (isRemoteUpdating) return;

      const blueName = document.getElementById('team-blue-name').value;
      const blueLogo = document.getElementById('team-blue-logo').value;
      const redName = document.getElementById('team-red-name').value;

      document.getElementById('name-blue-display').innerText = blueName;
      document.getElementById('name-red-display').innerText = redName;

      const logoContainer = document.getElementById('team-logo-container');
      if (blueLogo) {
        logoContainer.style.display = 'flex';
        setSafeImage(blueLogo, document.getElementById('team-logo-display'));
      } else {
        logoContainer.style.display = 'none';
      }

      const playersPayload = {};
      for (let i = 1; i <= 5; i++) {
        ['blue', 'red'].forEach(side => {
          const id = `${side}-${i}`;
          const agent = document.getElementById(`agent-${id}`).value;
          const kda = document.getElementById(`kda-input-${id}`).value;
          const acs = document.getElementById(`acs-input-${id}`).value;
          const fk = document.getElementById(`fk-input-${id}`).value;

          document.getElementById(`img-${id}`).src = `images/${agent}.png`;
          document.getElementById(`kda-${id}`).innerText = kda;
          document.getElementById(`acs-${id}`).innerText = acs;
          if (i === 1) {
            document.getElementById(`fk-${id}`).innerText = fk;
          }

          playersPayload[id] = { agent, kda, acs, fk };
        });
      }

      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => {
        const data = {
          teams: {
            blue: { name: blueName, logo: blueLogo },
            red: { name: redName }
          },
          players: playersPayload
        };
        fetch(TOPIC_URL, { method: 'POST', body: JSON.stringify(data) }).catch(err => console.error(err));
      }, 100);
    }

    function listenForUpdates() {
      const eventSource = new EventSource(TOPIC_URL + "/sse");
      eventSource.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg && msg.message) renderUI(JSON.parse(msg.message));
        } catch (e) {}
      };
    }

    function togglePanel() {
      document.getElementById('admin-panel').classList.toggle('panel-hidden');
    }

    function resetAllState() {
      location.reload();
    }

    window.onload = init;
  </script>
</body>
</html>
