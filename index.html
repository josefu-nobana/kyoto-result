<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VALORANT Match Result Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Arial', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    #toggle-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: #ff4655;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #admin-panel {
      position: fixed;
      top: 45px;
      left: 10px;
      z-index: 9999;
      background: rgba(15, 25, 35, 0.96);
      border: 2px solid #ff4655;
      padding: 15px;
      border-radius: 8px;
      color: white;
      max-height: 88vh;
      overflow-y: auto;
      width: 420px;
      font-family: sans-serif;
    }

    .panel-hidden { display: none !important; }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      padding: 6px 8px;
      margin: 12px 0 6px 0;
      border-radius: 4px;
    }
    .blue-title { background: #00b4d8; color: white; }
    .red-title { background: #ff4655; color: white; }
    .map-title { background: #ffb142; color: #111; }
    .sheet-title { background: #2ecc71; color: #111; }

    .info-box {
      background: rgba(255,255,255,0.08);
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-ctrl-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 4px;
    }
    .ctrl-inputs { display: flex; gap: 4px; }
    .ctrl-stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
    .ctrl-label { font-size: 11px; font-weight: bold; }

    input[type="text"], input[type="number"], select {
      padding: 5px 6px;
      border-radius: 4px;
      border: 1px solid #364966;
      background: #111c24;
      color: white;
      font-size: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    .lbl-sm { font-size: 10px; color: #aaa; margin-bottom: 2px; }

    .btn-action {
      background: #2ecc71;
      color: #111;
      font-weight: bold;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-control { flex: 1; padding: 8px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-reset { background: #e74c3c; color: white; }

    /* =========================================
       OVERLAY CANVAS (1920x1080)
       ========================================= */
    #overlay-container {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-wrapper {
      width: 1720px;
      height: 920px;
      background: rgba(15, 25, 35, 0.88);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 背景マップ画像 */
    .bg-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.18;
      z-index: 0;
    }

    /* 1. ヘルパーチーム名ヘッダー */
    .teams-header {
      position: relative;
      z-index: 1;
      height: 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      background: rgba(10, 15, 22, 0.6);
    }

    .team-name-box {
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 20px;
    }
    .team-name-box.blue {
      justify-content: flex-start;
      border-left: 8px solid #00b4d8;
    }
    .team-name-box.red {
      justify-content: flex-end;
      border-right: 8px solid #ff4655;
      flex-direction: row-reverse;
    }

    .team-logo { width: 60px; height: 60px; object-fit: contain; }
    .team-title-text { font-size: 38px; font-weight: 900; color: #fff; letter-spacing: 1px; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); }

    /* 2. MVPセクション（左右トッププレイヤー） */
    .mvp-section {
      position: relative;
      z-index: 1;
      height: 230px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.3);
    }

    .mvp-card {
      display: flex;
      align-items: center;
      padding: 0 40px;
      position: relative;
    }
    .mvp-card.blue { justify-content: flex-start; }
    .mvp-card.red { justify-content: flex-end; flex-direction: row-reverse; }

    .mvp-avatar-wrap {
      width: 160px;
      height: 200px;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .mvp-card.blue .mvp-avatar-wrap { border-left: 5px solid #00b4d8; }
    .mvp-card.red .mvp-avatar-wrap { border-right: 5px solid #ff4655; }
    .mvp-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

    .mvp-badge {
      position: absolute;
      top: 10px;
      background: #7b2cbf;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 10px;
      letter-spacing: 1px;
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .mvp-card.blue .mvp-badge { left: 15px; }
    .mvp-card.red .mvp-badge { right: 15px; }

    .mvp-info {
      display: flex;
      flex-direction: column;
      margin: 0 30px;
    }
    .mvp-card.blue .mvp-info { align-items: flex-start; }
    .mvp-card.red .mvp-info { align-items: flex-end; text-align: right; }

    .mvp-name { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin-bottom: 6px; }
    .mvp-stats-grid { display: flex; gap: 20px; font-size: 26px; font-weight: 900; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .mvp-stat-label { font-size: 11px; color: #8b978f; letter-spacing: 1px; text-transform: uppercase; }

    /* 中央のスタッツ項目名（KD, ACS, FIRST KILLSなど） */
    .center-stats-labels {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 130px;
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 2;
      pointer-events: none;
    }
    .stat-label-item {
      font-size: 12px;
      font-weight: 800;
      color: #8b978f;
      letter-spacing: 2px;
      text-align: center;
      background: rgba(15,25,35,0.8);
      padding: 2px 12px;
      border-radius: 3px;
    }

    /* 3. 通常メンバーリスト（4人×2チーム） */
    .members-section {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(10, 15, 22, 0.4);
    }

    .team-members-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 10px 40px;
    }
    .team-members-col.blue { border-right: 1px solid rgba(255,255,255,0.08); }

    .member-row {
      display: grid;
      grid-template-columns: 70px 1fr 140px 100px;
      align-items: center;
      background: rgba(255,255,255,0.03);
      padding: 6px 14px;
      border-radius: 4px;
      height: 64px;
    }

    .member-avatar {
      width: 52px;
      height: 52px;
      object-fit: cover;
      object-position: top center;
      border-radius: 4px;
    }
    .team-members-col.blue .member-avatar { border-left: 3px solid #00b4d8; }
    .team-members-col.red .member-avatar { border-left: 3px solid #ff4655; }

    .member-name { font-size: 18px; font-weight: 800; color: #fff; padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .member-stats { font-size: 20px; font-weight: 800; color: #fff; text-align: center; }
    .member-acs { font-size: 20px; font-weight: 800; color: #ece8e1; text-align: center; }
  </style>
</head>
<body>

  <button id="toggle-btn" onclick="togglePanel()">⚙️ 管理パネル 開閉</button>

  <div id="admin-panel">
    <h3 style="margin: 0 0 10px 0; color: #ff4655; font-size: 15px;">VALORANT 大会リザルト設定</h3>

    <div class="btn-group">
      <button class="btn-control btn-reset" onclick="resetAllState()">全リセット</button>
    </div>

    <div class="section-title sheet-title">📊 Googleスプレッドシート連携</div>
    <div class="info-box">
      <input type="text" id="sheet-id-input" placeholder="スプレッドシートID" oninput="sendState()">
      <button class="btn-action" onclick="fetchSheetData()">データ読み込み</button>
    </div>

    <div class="section-title blue-title">BLUE TEAM (左側)</div>
    <div class="info-box">
      <select id="select-team-blue-preset" onchange="applyTeamPreset('blue')">
        <option value="">-- シートからチーム選択 --</option>
      </select>
      <input type="text" id="team-blue-name" value="東京TECH B" oninput="sendState()" placeholder="チーム名">
      <input type="text" id="team-blue-logo" value="" oninput="sendState()" placeholder="ロゴURL">
    </div>
    <div id="blue-controls"></div>

    <div class="section-title red-title">RED TEAM (右側)</div>
    <div class="info-box">
      <select id="select-team-red-preset" onchange="applyTeamPreset('red')">
        <option value="">-- シートからチーム選択 --</option>
      </select>
      <input type="text" id="team-red-name" value="名古屋TECH B" oninput="sendState()" placeholder="チーム名">
      <input type="text" id="team-red-logo" value="" oninput="sendState()" placeholder="ロゴURL">
    </div>
    <div id="red-controls"></div>
  </div>

  <!-- オーバーレイ表示画面 (1920x1080) -->
  <div id="overlay-container">
    <div class="main-wrapper">
      <img id="bg-map-img" class="bg-map" src="images/sunset.png" alt="map">

      <!-- チーム名ヘッダー -->
      <div class="teams-header">
        <div class="team-name-box blue">
          <img id="logo-blue-img" class="team-logo" src="" style="display:none;" onerror="this.style.display='none';">
          <div id="name-blue-display" class="team-title-text">東京TECH B</div>
        </div>
        <div class="team-name-box red">
          <img id="logo-red-img" class="team-logo" src="" style="display:none;" onerror="this.style.display='none';">
          <div id="name-red-display" class="team-title-text">名古屋TECH B</div>
        </div>
      </div>

      <!-- 中央スタッツ項目名バー -->
      <div class="center-stats-labels">
        <div class="stat-label-item">KD / ACS / FIRST KILLS</div>
      </div>

      <!-- MVPセクション (プレイヤー1がMVP) -->
      <div class="mvp-section">
        <!-- BLUE MVP (Player 1) -->
        <div class="mvp-card blue">
          <div class="mvp-avatar-wrap">
            <div class="mvp-badge">MVP</div>
            <img id="img-blue-1" class="mvp-img" src="images/jett.png" alt="agent">
          </div>
          <div class="mvp-info">
            <div id="pname-blue-1" class="mvp-name">Player 1</div>
            <div class="mvp-stats-grid">
              <div><span id="kda-blue-1">23 / 13</span><div class="mvp-stat-label">KD</div></div>
              <div><span id="acs-blue-1">340</span><div class="mvp-stat-label">ACS</div></div>
              <div><span id="fk-blue-1">5</span><div class="mvp-stat-label">FIRST KILLS</div></div>
            </div>
          </div>
        </div>

        <!-- RED MVP (Player 1) -->
        <div class="mvp-card red">
          <div class="mvp-avatar-wrap">
            <div class="mvp-badge">MVP</div>
            <img id="img-red-1" class="mvp-img" src="images/omen.png" alt="agent">
          </div>
          <div class="mvp-info">
            <div id="pname-red-1" class="mvp-name">Player 1</div>
            <div class="mvp-stats-grid">
              <div><span id="fk-red-1">1</span><div class="mvp-stat-label" style="text-align:right;">FIRST KILLS</div></div>
              <div><span id="acs-red-1">261</span><div class="mvp-stat-label" style="text-align:right;">ACS</div></div>
              <div><span id="kda-red-1">20 / 9</span><div class="mvp-stat-label" style="text-align:right;">KD</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 通常メンバーセクション (プレイヤー2〜5) -->
      <div class="members-section">
        <div id="blue-members-col" class="team-members-col blue"></div>
        <div id="red-members-col" class="team-members-col red"></div>
      </div>
    </div>
  </div>

  <script>
    const agents = [
      { category: "デュエリスト", list: [
        { id: "jett", name: "ジェット" }, { id: "phoenix", name: "フェニックス" },
        { id: "reyna", name: "レイナ" }, { id: "raze", name: "レイズ" },
        { id: "yoru", name: "ヨル" }, { id: "neon", name: "ネオン" },
        { id: "iso", name: "アイソ" }, { id: "waylay", name: "ウェイレイ" },
        { id: "hash", name: "ハッシュ" }
      ]},
      { category: "イニシエーター", list: [
        { id: "sova", name: "ソーヴァ" }, { id: "breach", name: "ブリーチ" },
        { id: "skye", name: "スカイ" }, { id: "kayo", name: "KAY/O" },
        { id: "fade", name: "フェイド" }, { id: "gekko", name: "ゲッコー" },
        { id: "tejo", name: "テホ" }
      ]},
      { category: "コントローラー", list: [
        { id: "brimstone", name: "ブリムストーン" }, { id: "omen", name: "オーメン" },
        { id: "viper", name: "ヴァイパー" }, { id: "astra", name: "アストラ" },
        { id: "harbor", name: "ハーバー" }, { id: "clove", name: "クローヴ" },
        { id: "miks", name: "ミクス" }
      ]},
      { category: "センチネル", list: [
        { id: "sage", name: "セージ" }, { id: "cypher", name: "サイファー" },
        { id: "killjoy", name: "キルジョイ" }, { id: "chamber", name: "チェンバー" },
        { id: "deadlock", name: "デッドロック" }, { id: "vyse", name: "ヴァイス" },
        { id: "veto", name: "ヴィトー" }
      ]}
    ];

    const TOPIC_URL = "https://ntfy.sh/josefu_val_result_layout_2026";
    let loadedTeamsData = [];
    let isRemoteUpdating = false;

    function setSafeImage(url, imgElement) {
      if (!url) { imgElement.style.display = 'none'; return; }
      let val = String(url).trim();
      const matchImageFunc = val.match(/=IMAGE\s*\(\s*["']([^"']+)["']\s*\)/i);
      if (matchImageFunc && matchImageFunc[1]) val = matchImageFunc[1];
      if (val.includes("drive.google.com") || val.includes("googleusercontent.com")) {
        let fileId = "";
        const matchId = val.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (matchId && matchId[1]) fileId = matchId[1];
        else {
          const matchParam = val.match(/[?&]id=([a-zA-Z0-9_-]+)/);
          if (matchParam && matchParam[1]) fileId = matchParam[1];
        }
        if (fileId) val = `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        const cleaned = val.toLowerCase().replace(/\s+/g, '');
        imgElement.src = cleaned.endsWith('.png') ? `images/${cleaned}` : `images/${cleaned}.png`;
        imgElement.style.display = 'block';
        return;
      }
      imgElement.src = val;
      imgElement.style.display = 'block';
    }

    function createAgentSelectHTML(id, defaultAgent) {
      let html = `<select id="agent-${id}" onchange="sendState()">`;
      agents.forEach(group => {
        html += `<optgroup label="${group.category}">`;
        group.list.forEach(a => {
          const sel = (a.id === defaultAgent) ? 'selected' : '';
          html += `<option value="${a.id}" ${sel}>${a.name}</option>`;
        });
        html += `</optgroup>`;
      });
      html += `</select>`;
      return html;
    }

    function init() {
      ['blue', 'red'].forEach(side => {
        const ctrl = document.getElementById(`${side}-controls`);
        const membersCol = document.getElementById(`${side}-members-col`);
        const titleColor = side === 'blue' ? '#00b4d8' : '#ff4655';

        for (let i = 1; i <= 5; i++) {
          const id = `${side}-${i}`;
          const defName = i === 1 ? (side === 'blue' ? 'JettMain' : 'OmenMain') : `Player ${i}`;
          const defAgent = i === 1 ? (side === 'blue' ? 'jett' : 'omen') : 'sova';
          const badgeText = i === 1 ? ' [👑 MVP]' : '';

          // 管理パネル用入力欄生成
          ctrl.innerHTML += `
            <div class="player-ctrl-row">
              <span class="ctrl-label" style="color:${titleColor};">${side.toUpperCase()} メンバー ${i}${badgeText}</span>
              <div class="ctrl-inputs">
                <input type="text" id="name-input-${id}" value="${defName}" oninput="sendState()" placeholder="プレイヤー名">
                ${createAgentSelectHTML(id, defAgent)}
              </div>
              <div class="ctrl-stats">
                <div><div class="lbl-sm">K/D (例:23/13)</div><input type="text" id="kda-input-${id}" value="${i===1?'23/13':'15/15'}" oninput="sendState()"></div>
                <div><div class="lbl-sm">ACS</div><input type="number" id="acs-input-${id}" value="${i===1?'340':'200'}" oninput="sendState()"></div>
                <div><div class="lbl-sm">FK (1位のみ)</div><input type="number" id="fk-input-${id}" value="${i===1?'5':'0'}" oninput="sendState()"></div>
              </div>
            </div>`;

          // 通常メンバー欄（2〜5人目のみ下部リストに表示）
          if (i > 1) {
            membersCol.innerHTML += `
              <div class="member-row">
                <img id="img-${id}" class="member-avatar" src="images/${defAgent}.png" alt="agent">
                <div id="pname-${id}" class="member-name">${defName}</div>
                <div id="kda-${id}" class="member-stats">${i===1?'23/13':'15/15'}</div>
                <div id="acs-${id}" class="member-acs">${i===1?'340':'200'}</div>
              </div>`;
          }
        }
      });

      if (window.location.search.includes('obs')) {
        const style = document.createElement('style');
        style.innerHTML = '#admin-panel, #toggle-btn { display: none !important; }';
        document.head.appendChild(style);
      }

      listenForUpdates();
    }

    function renderUI(data) {
      if (!data) return;
      isRemoteUpdating = true;

      if (data.teams) {
        if (data.teams.blue) {
          document.getElementById('team-blue-name').value = data.teams.blue.name;
          document.getElementById('name-blue-display').innerText = data.teams.blue.name;
          document.getElementById('team-blue-logo').value = data.teams.blue.logo || '';
          setSafeImage(data.teams.blue.logo, document.getElementById('logo-blue-img'));
        }
        if (data.teams.red) {
          document.getElementById('team-red-name').value = data.teams.red.name;
          document.getElementById('name-red-display').innerText = data.teams.red.name;
          document.getElementById('team-red-logo').value = data.teams.red.logo || '';
          setSafeImage(data.teams.red.logo, document.getElementById('logo-red-img'));
        }
      }

      if (data.players) {
        Object.keys(data.players).forEach(id => {
          const p = data.players[id];
          document.getElementById(`name-input-${id}`).value = p.name;
          document.getElementById(`agent-${id}`).value = p.agent;
          document.getElementById(`kda-input-${id}`).value = p.kda;
          document.getElementById(`acs-input-${id}`).value = p.acs;
          document.getElementById(`fk-input-${id}`).value = p.fk;

          // 画面への反映
          if (id.endsWith('-1')) {
            // MVP枠
            document.getElementById(`pname-${id}`).innerText = p.name;
            document.getElementById(`img-${id}`).src = `images/${p.agent}.png`;
            document.getElementById(`kda-${id}`).innerText = p.kda;
            document.getElementById(`acs-${id}`).innerText = p.acs;
            document.getElementById(`fk-${id}`).innerText = p.fk;
          } else {
            // 通常メンバー枠
            document.getElementById(`pname-${id}`).innerText = p.name;
            document.getElementById(`img-${id}`).src = `images/${p.agent}.png`;
            document.getElementById(`kda-${id}`).innerText = p.kda;
            document.getElementById(`acs-${id}`).innerText = p.acs;
          }
        });
      }

      setTimeout(() => { isRemoteUpdating = false; }, 200);
    }

    let sendTimer = null;
    function sendState() {
      if (isRemoteUpdating) return;

      const blueName = document.getElementById('team-blue-name').value;
      const blueLogo = document.getElementById('team-blue-logo').value;
      const redName = document.getElementById('team-red-name').value;
      const redLogo = document.getElementById('team-red-logo').value;

      document.getElementById('name-blue-display').innerText = blueName;
      document.getElementById('name-red-display').innerText = redName;
      setSafeImage(blueLogo, document.getElementById('logo-blue-img'));
      setSafeImage(redLogo, document.getElementById('logo-red-img'));

      const playersPayload = {};
      for (let i = 1; i <= 5; i++) {
        ['blue', 'red'].forEach(side => {
          const id = `${side}-${i}`;
          const name = document.getElementById(`name-input-${id}`).value;
          const agent = document.getElementById(`agent-${id}`).value;
          const kda = document.getElementById(`kda-input-${id}`).value;
          const acs = document.getElementById(`acs-input-${id}`).value;
          const fk = document.getElementById(`fk-input-${id}`).value;

          if (i === 1) {
            document.getElementById(`pname-${id}`).innerText = name;
            document.getElementById(`img-${id}`).src = `images/${agent}.png`;
            document.getElementById(`kda-${id}`).innerText = kda;
            document.getElementById(`acs-${id}`).innerText = acs;
            document.getElementById(`fk-${id}`).innerText = fk;
          } else {
            document.getElementById(`pname-${id}`).innerText = name;
            document.getElementById(`img-${id}`).src = `images/${agent}.png`;
            document.getElementById(`kda-${id}`).innerText = kda;
            document.getElementById(`acs-${id}`).innerText = acs;
          }

          playersPayload[id] = { name, agent, kda, acs, fk };
        });
      }

      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => {
        const data = {
          teams: {
            blue: { name: blueName, logo: blueLogo },
            red: { name: redName, logo: redLogo }
          },
          players: playersPayload
        };
        fetch(TOPIC_URL, { method: 'POST', body: JSON.stringify(data) }).catch(err => console.error(err));
      }, 100);
    }

    function listenForUpdates() {
      const eventSource = new EventSource(TOPIC_URL + "/sse");
      eventSource.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg && msg.message) renderUI(JSON.parse(msg.message));
        } catch (e) {}
      };
    }

    function togglePanel() {
      document.getElementById('admin-panel').classList.toggle('panel-hidden');
    }

    function resetAllState() {
      location.reload();
    }

    window.onload = init;
  </script>
</body>
</html>
